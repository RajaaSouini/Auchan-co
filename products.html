<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/dist/output.css">
</head>
<body>
    <header>
        <p class="font-mono text-white bg-black text-center p-2">Livraison offerte dès 50 dh</p>
        <nav class="md:p-4">
            <div class="flex flex-row justify-around md:flex md:justify-between">
                <img src="/assets/images/logo-blac.png" alt="logo-page-auchan" class="w-48 h-32 ">
                <button><img src="/assets/icons/panier.png" alt="icone-panier" class="size-10   "></button>
            </div>
        </nav>        
    </header>
    <main>  
        <div class="flex flex-wrap gap-4 p-8 font-bold">
            <button class="border-2 rounded-xl p-4 border-[#DBD5D5]">Tout</button>
            <button class="border-2 rounded-xl p-4 border-[#DBD5D5]">Fruits & légumes</button>

        <section class="m-8 flex flex-col gap-8 md:flex-row md:flex-wrap containerProducts">
            
        </section>

        <div class=" flex flex-col gap-4">
            <img class="size-12" src="./assets/icons/horloge-24-heures.png" alt="">

                <h4 class="font-mono text-xl">Mieux manger</h4>
                <p>Des produits de saisons , et +1200 autre produits.</p>
            </div>
        </div>
        <div class=" flex flex-col gap-4">
            <img class="size-12" src="./assets/icons/cercle.png" alt="">
            <div class="text-white">
                <h4 class="font-mono text-xl">Livraison</h4>
                <p>Livraison partout , juste remplissez vos panier , et contacter nous.</p>
            </div>
        </div>
    </footer>
    <script type="module" src="./js/main.js" ></script>
